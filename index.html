<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stadia Urban Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.1.1/maplibre-gl.css">
<style>
:root{
  --bg:#1A1D21;
  --surface:#25282C;
  --surface2:#2A2D31;
  --border:#3A3F44;
  --teal:#5CB8A7;
  --teal-dim:rgba(92,184,167,0.15);
  --teal-border:rgba(92,184,167,0.35);
  --text:#E0E6EB;
  --text-muted:#8F97A0;
  --text-dim:#4a5058;
  --font:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;height:100%;background:var(--bg)}
#root{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Scrollbars */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* MapLibre */
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none!important}
.maplibregl-popup-content{background:#061510!important;color:#d0ede9!important;border-radius:5px!important;padding:7px 10px!important;box-shadow:0 0 0 1px rgba(92,184,167,0.25),0 4px 24px rgba(0,0,0,0.7)!important}
.maplibregl-popup-tip{border-top-color:#061510!important}
.click-popup .maplibregl-popup-content{background:#071a14!important;box-shadow:0 0 0 1px rgba(92,184,167,0.45),0 0 18px rgba(92,184,167,0.18),0 4px 24px rgba(0,0,0,0.8)!important;padding:8px 12px!important}

/* Lightbox */
.lightbox-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:rgba(10,10,11,0.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.lightbox-content{width:90vw;height:88vh;border-radius:10px;overflow:hidden;border:1px solid #2a2a2b;position:relative}
.lightbox-close{position:absolute;top:10px;right:14px;z-index:10;background:rgba(10,10,11,0.7);border:1px solid #333;border-radius:4px;color:#aaa;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.lightbox-title{position:absolute;top:10px;left:14px;z-index:10;background:rgba(10,10,11,0.7);border-radius:4px;padding:4px 10px;font-size:11px;color:#888;font-weight:600}

/* Expand button */
.expand-btn{position:absolute;top:6px;right:6px;z-index:5;background:rgba(10,10,11,0.6);border:1px solid #333;border-radius:3px;color:#888;padding:2px 6px;font-size:9px;cursor:pointer;font-family:inherit;opacity:0;transition:opacity 0.2s}
.map-panel:hover .expand-btn{opacity:1}

/* Tooltip */
.pnl-tooltip{position:absolute;top:100%;left:0;z-index:200;background:rgba(10,10,11,0.95);border:1px solid #2a2a2b;border-radius:6px;padding:8px 12px;font-size:10px;color:#888;line-height:1.5;max-width:260px;pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity 0.15s,transform 0.15s;white-space:normal;font-weight:400;box-shadow:0 4px 20px rgba(0,0,0,0.6)}
.pnl-title-wrap{position:relative;display:inline-block;cursor:default}
.pnl-title-wrap:hover .pnl-tooltip{opacity:1;transform:translateY(2px)}

/* Sidebar */
.sidebar{width:56px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:0;flex-shrink:0;z-index:10}
.sidebar-tab{width:100%;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;color:var(--text-dim);transition:all 0.15s;position:relative;border-left:3px solid transparent;font-family:var(--font)}
.sidebar-tab:hover{color:var(--text-muted);background:rgba(255,255,255,0.03)}
.sidebar-tab.active{color:var(--teal);background:var(--teal-dim);border-left-color:var(--teal)}
.sidebar-tab svg{width:18px;height:18px;flex-shrink:0}
.sidebar-tab-label{font-size:8px;letter-spacing:0.3px;font-weight:500;text-transform:uppercase}
.sidebar-divider{width:32px;height:1px;background:var(--border);margin:4px 0;flex-shrink:0}

/* Header */
.app-header{height:44px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;justify-content:space-between;flex-shrink:0;z-index:20}
.app-header-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.3px;font-family:var(--font)}
.app-header-sub{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:1px}
.app-header-links{display:flex;gap:16px}
.app-header-links a{font-size:11px;color:var(--text-muted);text-decoration:none;font-family:var(--font)}
.app-header-links a:hover{color:var(--text)}

/* Body layout */
.app-body{flex:1;display:flex;overflow:hidden;min-height:0}
.app-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0}

/* Map screen */
.map-screen{flex:1;position:relative;overflow:hidden}

/* Dashboard screen */
.dash-screen{flex:1;display:flex;overflow:hidden;min-height:0;background:var(--bg)}
.dash-center{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0;padding:8px 8px 8px 8px;gap:6px}
.dash-right{width:200px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

/* Filter bar */
.filter-bar{display:flex;align-items:center;gap:10px;padding:5px 8px;background:var(--surface);border-radius:6px;flex-shrink:0;border:1px solid var(--border)}

/* Panel */
.dash-panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.dash-panel-title{padding:5px 8px;border-bottom:1px solid var(--border);font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0}

/* Right panel */
.right-section{padding:8px 10px;border-bottom:1px solid var(--border)}
.right-section:last-child{border-bottom:none}
.right-section-title{font-size:8px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px}
.metric-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.metric-label{font-size:10px;color:var(--text-muted)}
.metric-value{font-size:11px;font-weight:600;color:var(--text);font-family:'Courier New',monospace}
.metric-pct{font-size:8px;font-weight:600;color:var(--text-dim);margin-right:4px}

/* Placeholder tab content */
.tab-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-dim)}
.tab-placeholder-icon{font-size:32px;opacity:0.3}
.tab-placeholder-title{font-size:14px;font-weight:600;color:var(--text-muted)}
.tab-placeholder-sub{font-size:11px;color:var(--text-dim);text-align:center;max-width:280px;line-height:1.6}

/* Onboarding */
.ob-card{position:fixed;bottom:80px;right:24px;width:280px;background:rgba(14,14,15,0.95);border:1px solid #2a2a2b;border-radius:12px;padding:18px 22px;backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,0.6);z-index:10000;pointer-events:all}
.ob-card.ob-in{animation:obSlideIn 0.45s cubic-bezier(0.34,1.2,0.64,1) forwards}
.ob-card.ob-out{animation:obSlideOut 0.3s ease-in forwards}
@keyframes obSlideIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes obSlideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60px)}}
.ob-step{font-size:9px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.ob-title{font-size:13px;font-weight:700;color:#ddd;margin-bottom:6px;line-height:1.3}
.ob-body{font-size:11px;color:#666;line-height:1.6;margin-bottom:14px}
.ob-dots{display:flex;gap:5px;align-items:center;margin-bottom:14px}
.ob-dot{width:5px;height:5px;border-radius:50%;background:#2a2a2b;transition:background 0.2s}
.ob-dot.active{background:var(--teal)}
.ob-actions{display:flex;align-items:center;justify-content:space-between}
.ob-btn{background:var(--teal);border:none;border-radius:6px;color:#fff;font-size:11px;font-weight:600;padding:7px 16px;cursor:pointer;font-family:inherit;transition:background 0.15s}
.ob-btn:hover{background:#4da898}
.ob-skip{background:none;border:none;color:#444;font-size:10px;cursor:pointer;font-family:inherit;padding:0}
.ob-skip:hover{color:#666}

/* ESC toast */
.esc-toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);animation:toastIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;z-index:9999;pointer-events:none}
.esc-toast.out{animation:toastOut 0.4s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(8px)}}
@keyframes kbdPulse{0%,100%{box-shadow:0 0 0 0 rgba(92,184,167,0.4)}50%{box-shadow:0 0 0 6px rgba(92,184,167,0)}}

/* Range input */
input[type=range]{accent-color:var(--teal);height:3px;cursor:pointer}

/* Category pill */
.cat-pill{font-size:8px;padding:2px 6px;border-radius:3px;cursor:pointer;font-family:inherit;transition:all 0.1s;border:1px solid transparent}

/* Country panel */
.country-panel{position:absolute;top:10px;right:10px;z-index:100;width:210px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;background:rgba(26,29,33,0.96);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.country-list-btn{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(58,63,68,0.5);padding:6px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;text-align:left;transition:background 0.15s;font-family:var(--font)}
.country-list-btn:hover{background:rgba(255,255,255,0.04)}

/* Landing page */
.landing-screen{flex:1;overflow-y:auto;overflow-x:hidden;background:#0d0f10;font-family:'Inter',system-ui,sans-serif;}
.landing-hero{position:relative;min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px 80px;overflow:hidden;}
.landing-hero-bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,16,0.55) 0%,rgba(13,15,16,0.8) 60%,#0d0f10 100%),repeating-linear-gradient(135deg,rgba(92,184,167,0.08) 0px,rgba(92,184,167,0.08) 2px,transparent 2px,transparent 16px),#12181a;z-index:0;}
.landing-hero-placeholder-label{position:absolute;bottom:18px;right:22px;z-index:1;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:rgba(224,230,235,0.3);text-transform:uppercase;}
.landing-grid-lines{position:absolute;inset:0;z-index:0;opacity:0.18;background-image:linear-gradient(rgba(92,184,167,0.4) 1px,transparent 1px),linear-gradient(90deg,rgba(92,184,167,0.4) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 70% 70% at 50% 60%,black 20%,transparent 80%);}
.landing-hero-content{position:relative;z-index:1;max-width:720px;}
.landing-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-bottom:24px;opacity:0.9;}
.landing-h1{font-size:clamp(32px,5vw,58px);font-weight:400;color:#e8edf0;line-height:1.12;letter-spacing:-1px;margin-bottom:16px;}
.landing-h1 em{font-style:italic;color:var(--teal);}
.landing-subtitle{font-family:'DM Sans',sans-serif;font-size:16px;color:#7a8a92;line-height:1.6;max-width:520px;margin:0 auto 40px;}
.landing-cta{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:13px 28px;border-radius:6px;border:none;cursor:pointer;letter-spacing:0.2px;transition:background 0.2s,transform 0.15s;text-decoration:none;}
.landing-cta:hover{background:#4da898;transform:translateY(-1px);}
.landing-cta svg{transition:transform 0.2s;}
.landing-cta:hover svg{transform:translateX(3px);}
.landing-stats{display:flex;gap:48px;justify-content:center;margin-top:64px;position:relative;z-index:1;}
.landing-stat{text-align:center;}
.landing-stat-n{font-size:28px;font-weight:400;color:#e8edf0;letter-spacing:-1px;}
.landing-stat-n span{color:var(--teal);}
.landing-stat-l{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#4a5560;margin-top:4px;}
.landing-divider{width:1px;background:linear-gradient(to bottom,transparent,rgba(92,184,167,0.2),transparent);align-self:stretch;}

.landing-section{padding:72px 40px;max-width:900px;margin:0 auto;}
.landing-section-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-bottom:12px;}
.landing-section-title{font-size:clamp(22px,3vw,32px);font-weight:400;color:#d0d8dc;letter-spacing:-0.5px;margin-bottom:10px;}
.landing-section-body{font-family:'DM Sans',sans-serif;font-size:14px;color:#5a6870;line-height:1.7;max-width:560px;margin-bottom:40px;}

.landing-4d-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.landing-4d-card{background:#131618;border:1px solid #1e2427;border-radius:8px;padding:20px 18px;transition:border-color 0.2s,background 0.2s;}
.landing-4d-card:hover{border-color:rgba(92,184,167,0.3);background:#161a1c;}
.landing-4d-icon{color:var(--teal);margin-bottom:14px;opacity:0.85;}
.landing-4d-name{font-size:14px;font-weight:400;color:#c8d4d8;margin-bottom:6px;letter-spacing:-0.2px;}
.landing-4d-desc{font-family:'DM Sans',sans-serif;font-size:11px;color:#4a5a62;line-height:1.6;}

.landing-impact{background:#0f1315;border-top:1px solid #1a1e21;border-bottom:1px solid #1a1e21;padding:72px 40px;}
.landing-impact-inner{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;}
.landing-impact-text{}
.landing-outline-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#7a8a92;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:10px 20px;border-radius:6px;border:1px solid #2a3338;cursor:pointer;letter-spacing:0.2px;transition:border-color 0.2s,color 0.2s;margin-top:24px;}
.landing-outline-btn:hover{border-color:rgba(92,184,167,0.4);color:#9ab4bc;}

.landing-footer{padding:24px 40px;max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #161a1c;}
.landing-footer-copy{font-family:'DM Sans',sans-serif;font-size:10px;color:#2e3840;letter-spacing:0.5px;}
.landing-footer-links{display:flex;gap:20px;}
.landing-footer-links a{font-family:'DM Sans',sans-serif;font-size:10px;color:#2e3840;text-decoration:none;letter-spacing:0.5px;transition:color 0.2s;}
.landing-footer-links a:hover{color:#5a6870;}
</style>

// Percentile helpers — use manifest array (IX) loaded from data/index.json
function pctRank(slug,key,manifest,lowerIsBetter=false){
  if(!manifest||!manifest.length)return null;
  const vals=manifest.map(s=>s[key]).filter(v=>v>0);
  if(!vals.length)return null;
  const mine=manifest.find(s=>s.slug===slug)?.[key];
  if(!mine)return null;
  vals.sort((a,b)=>a-b);
  const rank=vals.filter(v=>lowerIsBetter?v>mine:v<mine).length;
  return Math.round((rank/vals.length)*100);
}
function pctLabel(pct){
  if(pct===null)return null;
  if(pct>=90)return"top 10%";
  if(pct>=75)return"top 25%";
  if(pct>=50)return"top half";
  if(pct>=25)return"bottom half";
  if(pct>=10)return"bottom 25%";
  return"bottom 10%";
}
function genHeadline(slug,name,manifest){
  if(!manifest)return null;
  const s=manifest.find(m=>m.slug===slug);
  if(!s)return null;
  const divPct=pctRank(slug,'diversity',manifest);
  const plPct=pctRank(slug,'places',manifest);
  const distPct=pctRank(slug,'medianDist',manifest,true);
  if(divPct!==null&&divPct>=75&&plPct!==null&&plPct>=75)
    return`${name} stands out for both urban density and diversity of activity — among the most vibrant stadiums in this study.`;
  if(divPct!==null&&divPct>=85)
    return`${name} shows exceptional diversity of urban activity, ranking in the ${pctLabel(divPct)} of all studied stadiums.`;
  if(plPct!==null&&plPct>=85)
    return`${name} is surrounded by one of the densest urban environments in this study, with ${s.places.toLocaleString()} places mapped in its surroundings.`;
  if(distPct!==null&&distPct>=75)
    return`Urban activity around ${name} is concentrated close to the stadium, suggesting a walkable, compact neighbourhood.`;
  if(divPct!==null&&divPct<=25)
    return`${name} sits in a relatively low-diversity urban environment, with activity dominated by a few place types.`;
  if(plPct!==null&&plPct<=25)
    return`${name} has limited urban activity nearby — one of the more isolated facilities in this study.`;
  return`${name} shows a mid-range urban profile within this study, with ${s.places.toLocaleString()} places mapped in its surroundings and a diversity index of ${s.diversity}.`;
}

// Build country index: groups stadiums by country, computes centroid
function buildCountryIndex(stadiums,sc){
  const countries={};
  stadiums.forEach(s=>{
    const country=s.country||sc[s.slug]||"Unknown";
    if(!countries[country])countries[country]={name:country,stadiums:[],lat:0,lng:0};
    countries[country].stadiums.push(s);
  });
  Object.values(countries).forEach(c=>{
    c.lat=c.stadiums.reduce((a,s)=>a+s.lat,0)/c.stadiums.length;
    c.lng=c.stadiums.reduce((a,s)=>a+s.lng,0)/c.stadiums.length;
  });
  return countries;
}

// Shannon-based diversity — identical formula to the Stats component, the IX
// manifest, and the poster's generate_grid_excel.py. Used app-wide so every
// scale (whole-site index, grid cells, distance rings) reports the same metric.
function divScore(catCounts,total){
  if(!total)return 0;
  const vals=Object.values(catCounts).filter(v=>v>0);
  const n=vals.length;if(!n)return 0;
  let shannon=0;vals.forEach(v=>{const p=v/total;shannon-=p*Math.log(p);});
  const maxShannon=n>1?Math.log(n):1;
  const evenness=maxShannon>0?shannon/maxShannon:0;
  return evenness*Math.sqrt(total/100)*(n/16);
}
// Viridis colour ramp (t in 0..1) — perceptual scale for diversity surfaces.
function viridis(t){
  t=Math.max(0,Math.min(1,t));
  const stops=[[0,68,1,84],[0.25,59,82,139],[0.5,33,145,140],[0.75,94,201,98],[1,253,231,37]];
  for(let i=0;i<stops.length-1;i++){
    if(t>=stops[i][0]&&t<=stops[i+1][0]){
      const f=(t-stops[i][0])/(stops[i+1][0]-stops[i][0]);
      return[Math.round(stops[i][1]+(stops[i+1][1]-stops[i][1])*f),
             Math.round(stops[i][2]+(stops[i+1][2]-stops[i][2])*f),
             Math.round(stops[i][3]+(stops[i+1][3]-stops[i][3])*f)];
    }
  }
  return[253,231,37];
}

function makeYlOrRd(npts){
  const scale=Math.min(1.0, Math.max(0.2, (npts-30)/1500));
  return function(t){
    if(t<0.12)return[0,0,0,0];
    const intensity=(t-0.12)/0.88;
    const stops=[
      [0.0,255,255,230],[0.12,255,247,188],[0.25,254,227,145],
      [0.38,254,196,79],[0.50,253,159,51],[0.62,246,120,32],
      [0.75,228,65,21],[0.87,200,20,15],[1.0,140,0,20],
    ];
    let r=140,g=0,b=20;
    for(let i=0;i<stops.length-1;i++){
      if(intensity>=stops[i][0]&&intensity<=stops[i+1][0]){
        const f=(intensity-stops[i][0])/(stops[i+1][0]-stops[i][0]);
        r=Math.round(stops[i][1]+(stops[i+1][1]-stops[i][1])*f);
        g=Math.round(stops[i][2]+(stops[i+1][2]-stops[i][2])*f);
        b=Math.round(stops[i][3]+(stops[i+1][3]-stops[i][3])*f);
        break;
      }
    }
    const alpha=Math.round(intensity*scale*210);
    return[r,g,b,alpha];
  };
}

      "Czech Rep.":"Czech Republic","Czechia":"Czech Republic",

        }},"carto-dark");

          "line-color":["case",

            ["==",["get","hasData"],1],"rgba(92,184,167,0.80)",

    map.addLayer({id:"stadiums-dot",type:"circle",source:"stadiums",filter:["!",["has","point_count"]],layout:{"visibility":"none"},paint:{"circle-radius":["interpolate",["linear"],["zoom"],1,8,5,10,10,13],"circle-color":"rgba(92,184,167,0.70)","circle-stroke-width":1.5,"circle-stroke-color":"rgba(190,235,228,0.60)"}});

    map.on("mouseenter","stadiums-cluster",()=>{map.getCanvas().style.cursor="pointer";});
    map.on("mouseleave","stadiums-cluster",()=>{map.getCanvas().style.cursor="";});
    map.on("click","stadiums-dot",(e)=>{

    map.on("mouseleave","stadiums-dot",()=>{map.getCanvas().style.cursor="";popup.remove();});

useEffect(()=>{
  const map=mapRef.current;if(!map||!loaded)return;
  if(!map.getLayer("stadiums-dot")||!map.getSource("stadiums"))return;
  const inCountry=!!selCountry;
  const inStadium=!!sel;
  const yearFiltered=!!(selYears&&selYears.size>0);
  // Show dots: in country drill-down OR at global level when year filter is active
  const showDots=(inCountry&&!inStadium)||(!inCountry&&yearFiltered);
  // Only cluster in country drill-down (not in global year-filter view)
  const showClusters=inCountry&&!inStadium;
  if(map.getLayer("countries-label"))map.setLayoutProperty("countries-label","visibility",(inCountry||yearFiltered)?"none":"visible");
  map.setLayoutProperty("stadiums-dot","visibility",showDots?"visible":"none");
  map.setLayoutProperty("stadiums-glow","visibility",showDots?"visible":"none");
  map.setLayoutProperty("stadiums-cluster","visibility",showClusters?"visible":"none");
  map.setLayoutProperty("stadiums-cluster-halo","visibility",showClusters?"visible":"none");
  map.setLayoutProperty("stadiums-cluster-count","visibility",showClusters?"visible":"none");

  const mkf=(s)=>({type:"Feature",geometry:{type:"Point",coordinates:[s.lng,s.lat]},properties:{slug:s.slug,name:s.name,country:(SC[s.slug]||"Unknown"),places:s.places}});

  const allFeatures=stadiums.map(mkf);
  const features=inCountry ? ((countries[selCountry]?.stadiums||[]).map(mkf)) : allFeatures;
  map.getSource("stadiums").setData({type:"FeatureCollection",features});

  // Clear legacy filters; source-level filtering (Option B) now controls clustering/points.
  map.setFilter("stadiums-dot",["!",["has","point_count"]]);
  map.setFilter("stadiums-glow",["!",["has","point_count"]]);
  map.setFilter("stadiums-cluster",["has","point_count"]);
  map.setFilter("stadiums-cluster-count",["has","point_count"]);
},[selCountry,sel,selYears,loaded,mapRef,countries,stadiums]);
// Pulse animation when year selection changes
useEffect(()=>{
  const map=mapRef.current;if(!map||!loaded||!selYears)return;
  if(!map.getLayer("stadiums-glow"))return;
  let tick=0;
  const id=setInterval(()=>{
    tick++;
    const big=tick%2===0;
    map.setPaintProperty("stadiums-glow","circle-radius",big?38:22);
    map.setPaintProperty("stadiums-glow","circle-color",big?"rgba(92,184,167,0.28)":"rgba(92,184,167,0.14)");
    if(tick>=5)clearInterval(id);
  },280);
  return()=>clearInterval(id);
},[selYears,loaded]);
useEffect(()=>{

  map.setPaintProperty("stadiums-dot","circle-radius",5);
},[sel,loaded,mapRef]);
return <div ref={cRef} style={{width:"100%",height:"100%"}}/>;
}

function StadiumTimeline({stadiums,selYears,setSelYears}){
const AXIS_Y=52; // px from top of track — axis runs here, bubbles centered here

const byYear=React.useMemo(()=>{
  const m={};
  stadiums.forEach(s=>{
    const y=s.openingYear;
    if(y&&y>1900&&y<2026){
      if(!m[y])m[y]={count:0,capacity:0};
      m[y].count++;
      if(s.capacity)m[y].capacity+=s.capacity;
    }
  });
  return Object.entries(m)
    .map(([y,d])=>({year:parseInt(y),count:d.count,capacity:d.capacity}))
    .sort((a,b)=>a.year-b.year);
},[stadiums]);

const minY=byYear[0]?.year||1900;
const maxY=byYear[byYear.length-1]?.year||2024;
const span=maxY-minY||1;
const maxCap=Math.max(...byYear.map(d=>d.capacity||d.count*40000));
// Radius: 14–52px, sized by total capacity that year
const getR=(d)=>14+Math.round(((d.capacity||d.count*40000)/maxCap)*38);

const dragStart=React.useRef(null);
const[hover,setHover]=useState(null); // {year,count,capacity,pct,r} of bubble under cursor
const toggleYear=(yr)=>{
  setSelYears(prev=>{
    const s=prev?new Set(prev):new Set();
    s.has(yr)?s.delete(yr):s.add(yr);
    return s.size===0?null:s;
  });
};
const onMouseDown=(e,yr)=>{dragStart.current=yr;e.preventDefault();};
const onMouseUp=(_e,yr)=>{
  if(dragStart.current!==null&&dragStart.current!==yr){
    const lo=Math.min(dragStart.current,yr),hi=Math.max(dragStart.current,yr);

};

}

function App(){

,[selYears]);
// Zoom to fit selected stadiums when year filter changes
useEffect(()=>{
  const map=mapRef.current;if(!map)return;

    [[Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]],

},[selYears]);
const[escUsed,setEscUsed]=useState(()=>localStorage.getItem('escUsed')==='1');
const[obStep,setObStep]=useState(()=>localStorage.getItem('onboardingSeen')==='1'?null:0);

const[escToast,setEscToast]=useState(false);
const[tabHint,setTabHint]=useState(false);
const nudgeTab=useCallback(()=>{setTabHint(true);clearTimeout(window.__tabHintT);window.__tabHintT=setTimeout(()=>setTabHint(false),1800);},[]);
const dRef=useRef(null);const mapRef=useRef(null);const topRef=useRef(null);const pendingFlyRef=useRef(null);const loadingSlugRef=useRef(null);

const tryScrollToDash=useCallback(()=>{
  const el=dRef.current;
  if(!el) return false;
  // If the page isn't taller than the viewport yet, scrolling can't happen.
  const canScroll=document.documentElement.scrollHeight>window.innerHeight+20;
  if(!canScroll) return false;
  try{el.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){
    const y=el.getBoundingClientRect().top+window.scrollY;
    window.scrollTo({top:y,behavior:'smooth'});
  }
  return true;
},[]);

const obDone=useCallback(()=>{setObStep(null);localStorage.setItem('onboardingSeen','1');},[]);

const handleCountrySelect=useCallback((country)=>{
  setObStep(s=>s===0?1:s); // advance from step 0→1 when country clicked
  setSelCountry(country.name);setSel(null);setSd(null);
  if(mapRef.current){
    const lats=country.stadiums.map(s=>s.lat);const lngs=country.stadiums.map(s=>s.lng);
    const spread=Math.max(Math.max(...lats)-Math.min(...lats),Math.max(...lngs)-Math.min(...lngs));
    const zoom=spread<0.1?12:spread<0.5?10:spread<1?9:spread<3?7:spread<8?6:spread<15?5:4;
    mapRef.current.flyTo({center:[country.lng,country.lat],zoom,duration:2000});
  }
},[]);

const handleSelect=useCallback((s)=>{
  setObStep(s2=>s2===1?2:s2);
  setSel(s);
  setSd(null); // clear stale data immediately so button resets to "Loading data…"
  loadingSlugRef.current=s.slug; // track latest request to discard stale responses
  const FLY_MS=5000;

    setSd(d);

  setTimeout(()=>setObStep(s=>s===2?null:s),12000);

  setEscToast(false);

  }
},[]);

// ESC toast triggered from handleSelect

const handleBack=useCallback(()=>{

},[sel,selCountry,COUNTRIES]);

useEffect(()=>{const handler=(e)=>{if(e.key==="Escape"){

return(

function TypeBar({places, selTypes, onToggleType}){
const cRef=useRef(null);const pRef=useRef(null);const rowsRef=useRef([]);
const [_sz,_setSz]=useState(0);
useEffect(()=>{if(!pRef.current)return;const o=new ResizeObserver(()=>_setSz(n=>n+1));o.observe(pRef.current);return()=>o.disconnect();},[]);
useEffect(()=>{
  if(!places?.length||!pRef.current)return;
  const c=cRef.current;const rect=pRef.current.getBoundingClientRect();
  const w=rect.width-4,h=rect.height-4;if(w<20||h<20)return;
  c.width=w*2;c.height=h*2;c.style.width=w+"px";c.style.height=h+"px";
  const ctx=c.getContext("2d");ctx.scale(2,2);ctx.clearRect(0,0,w,h);
  rowsRef.current=[];

  const typeCat={};const typeCnt={};
  places.forEach(d=>{
    const typ=d[4]||"unknown";const cat=d[2]||"uncategorized";
    typeCnt[typ]=(typeCnt[typ]||0)+1;
    if(!typeCat[typ])typeCat[typ]=cat;
  });

  const top=Object.entries(typeCnt).sort((a,b)=>b[1]-a[1]).slice(0,40);
  if(!top.length)return;
  const maxVal=top[0][1];const n=top.length;

  const pad={t:4,b:4,l:4,r:4};
  const gap=2;
  const ph=h-pad.t-pad.b;
  const bh=Math.max(8,(ph-(n-1)*gap)/n);
  const fontSize=Math.max(6,Math.min(8,bh/2-0.5));
  const cntW=22;
  const labelW=Math.floor(w*0.45);
  const barAreaX=pad.l+labelW+3;
  const barAreaW=w-barAreaX-cntW-pad.r;

  function wrapText(text,maxW){
    const words=text.replace(/_/g," ").split(" ");
    const lines=[];let cur="";
    ctx.font=`${fontSize}px system-ui`;
    words.forEach(word=>{
      const test=cur?cur+" "+word:word;
      if(ctx.measureText(test).width<=maxW){cur=test;}
      else{if(cur)lines.push(cur);cur=word;}
    });
    if(cur)lines.push(cur);
    return lines;
  }

  top.forEach(([typ,cnt],i)=>{
    const cat=typeCat[typ]||"uncategorized";
    const rgb=CC[cat]||CC.uncategorized;
    const barW=Math.max(2,(cnt/maxVal)*barAreaW);
    const y=pad.t+i*(bh+gap);

    const isActive=!selTypes||selTypes.has(typ);
    const isSelected=!!(selTypes&&selTypes.has(typ));
    ctx.fillStyle=isActive?`rgba(${rgb},${isSelected?0.85:0.55})`:"rgba(80,80,84,0.18)";
    ctx.fillRect(barAreaX,y,barW,bh);
    if(isSelected){ctx.strokeStyle=`rgba(${rgb},0.95)`;ctx.lineWidth=1;ctx.strokeRect(barAreaX+0.5,y+0.5,Math.max(1,barW-1),Math.max(1,bh-1));}

    const lines=wrapText(typ,labelW-4);
    const lineH=fontSize+1;
    const totalTextH=lines.length*lineH;
    const textStartY=y+(bh-totalTextH)/2+fontSize;
    rowsRef.current.push({typ,y,h:bh});
    ctx.fillStyle=isActive?"#999":"#555";ctx.font=`${fontSize}px system-ui`;
    ctx.textAlign="right";ctx.textBaseline="alphabetic";
    lines.forEach((line,li)=>{ctx.fillText(line,pad.l+labelW-2,textStartY+li*lineH);});

    ctx.fillStyle=isSelected?"#ddd":"#555";ctx.textAlign="right";
    ctx.fillText(cnt,w-pad.r,y+bh/2+fontSize/2-1);
  });
},[places,selTypes,_sz]);
const onCanvasClick=(e)=>{
  if(!rowsRef.current.length||!pRef.current||!onToggleType)return;
  const rect=pRef.current.getBoundingClientRect();
  const y=e.clientY-rect.top-2;
  const hit=rowsRef.current.find(r=>y>=r.y&&y<=r.y+r.h);
  if(hit) onToggleType(hit.typ);
};
return(<div ref={pRef} style={{width:"100%",height:"100%",padding:2}}>
  <canvas ref={cRef} onClick={onCanvasClick} style={{display:"block",cursor:"pointer"}}/>
</div>);}

function WalkRadar({places, maxDist}){
const cRef=useRef(null);const pRef=useRef(null);
const [_sz,_setSz]=useState(0);
useEffect(()=>{if(!pRef.current)return;const o=new ResizeObserver(()=>_setSz(n=>n+1));o.observe(pRef.current);return()=>o.disconnect();},[]);
useEffect(()=>{
  if(!places?.length||!pRef.current)return;
  const c=cRef.current;
  const rect=pRef.current.getBoundingClientRect();
  const w=rect.width,h=rect.height;
  if(w<40||h<40)return;
  c.width=w*2;c.height=h*2;c.style.width=w+"px";c.style.height=h+"px";
  const ctx=c.getContext("2d");ctx.scale(2,2);ctx.clearRect(0,0,w,h);

  // Bin places into 300m intervals for both graph (d[3]) and linear (d[5]) distances
  const binSize=300;
  const bins=["0–300","300–600","600–900","900–1.2k","1.2–1.5k","1.5–1.8k","1.8–2.1k","2.1–2.4k","2.4–2.7k","2.7–3k"];
  const nBins=bins.length;
  const graphCounts=new Array(nBins).fill(0);
  const linearCounts=new Array(nBins).fill(0);

  places.forEach(d=>{
    const gd=d[3];if(gd!=null){const b=Math.min(Math.floor(gd/binSize),nBins-1);graphCounts[b]++;}
    const ld=d[5];if(ld!=null){const b=Math.min(Math.floor(ld/binSize),nBins-1);linearCounts[b]++;}
  });

  const hasLinear=linearCounts.some(v=>v>0);
  let overlapScore=null;
  if(hasLinear){
    const sumMin=graphCounts.reduce((s,g,i)=>s+Math.min(g,linearCounts[i]),0);
    const sumMax=graphCounts.reduce((s,g,i)=>s+Math.max(g,linearCounts[i]),0);
    overlapScore=sumMax>0?Math.round((sumMin/sumMax)*100):null;
  }
  const maxVal=Math.max(...graphCounts,...linearCounts,1);

  // Radar geometry — leave room for legend at bottom
  const legH=22;
  const cx=w/2, cy=(h-legH)/2;
  const margin=Math.min(cx,cy)*0.28;
  const maxR=Math.min(cx,cy)-margin;
  const angleStep=(Math.PI*2)/nBins;
  const startAngle=-Math.PI/2;
  const pt=(angle,r)=>([cx+Math.cos(angle)*r, cy+Math.sin(angle)*r]);

  // Concentric grid rings
  const nRings=4;
  for(let ri=1;ri<=nRings;ri++){
    const r=(ri/nRings)*maxR;
    ctx.beginPath();
    for(let i=0;i<nBins;i++){
      const angle=startAngle+i*angleStep;
      const [x,y]=pt(angle,r);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=`rgba(255,255,255,${ri===nRings?0.35:0.15})`;
    ctx.lineWidth=0.5;ctx.stroke();
  }

  // Spokes + labels
  const labelFontSize=Math.max(6,Math.min(8,w*0.042));
  ctx.font=`${labelFontSize}px system-ui`;
  for(let i=0;i<nBins;i++){
    const angle=startAngle+i*angleStep;
    const [x0,y0]=pt(angle,2);
    const [x1,y1]=pt(angle,maxR);
    ctx.strokeStyle="rgba(255,255,255,0.25)";ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
    // Label
    const labelR=maxR+margin*0.52;
    const [lx,ly]=pt(angle,labelR);
    ctx.fillStyle="#9ca3aa";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(bins[i],lx,ly);
  }

  // Draw a filled polygon
  const drawPolygon=(counts,strokeColor,fillColor,dotColor)=>{
    ctx.beginPath();
    for(let i=0;i<nBins;i++){
      const angle=startAngle+i*angleStep;
      const r=(counts[i]/maxVal)*maxR;
      const [x,y]=pt(angle,r);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle=fillColor;ctx.fill();
    ctx.strokeStyle=strokeColor;ctx.lineWidth=1.5;ctx.stroke();
    // Vertex dots
    for(let i=0;i<nBins;i++){
      const angle=startAngle+i*angleStep;
      const r=(counts[i]/maxVal)*maxR;
      const [x,y]=pt(angle,r);
      ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);
      ctx.fillStyle=dotColor;ctx.fill();
    }
  };

  // Draw linear first (behind), then graph on top
  if(hasLinear){
    drawPolygon(linearCounts,"rgba(251,154,153,0.9)","rgba(251,154,153,0.1)","rgba(251,154,153,0.9)");
  }
  drawPolygon(graphCounts,"rgba(74,158,255,0.9)","rgba(74,158,255,0.13)","rgba(74,158,255,0.9)");

  // Center label
  const cLabelSize=Math.max(9,Math.min(15,maxR*0.22));
  ctx.textAlign="center";ctx.textBaseline="middle";
  if(overlapScore!==null){
    ctx.fillStyle="#ddd";ctx.font=`700 ${cLabelSize*1.1}px system-ui`;
    ctx.fillText(overlapScore+"%",cx,cy-cLabelSize*0.6);
    ctx.font=`${Math.max(6,labelFontSize-1)}px system-ui`;ctx.fillStyle="#8F97A0";
    ctx.fillText("path",cx,cy+cLabelSize*0.1);
    ctx.fillText("directness",cx,cy+cLabelSize*0.85);
  } else {
    ctx.fillStyle="#ddd";ctx.font=`600 ${cLabelSize}px system-ui`;
    ctx.fillText(places.length,cx,cy-cLabelSize*0.5);
    ctx.font=`${labelFontSize}px system-ui`;ctx.fillStyle="#8F97A0";
    ctx.fillText("places",cx,cy+cLabelSize*0.6);
  }

  // Legend at bottom
  const legY=h-legH+8;
  const midX=w/2;
  const swatchW=14,swatchH=3,gap=6;
  // Graph
  ctx.fillStyle="rgba(74,158,255,0.9)";ctx.fillRect(midX-(hasLinear?90:45),legY,swatchW,swatchH);
  ctx.fillStyle="#9ca3aa";ctx.font=`${labelFontSize}px system-ui`;ctx.textAlign="left";
  ctx.fillText("Graph dist.",midX-(hasLinear?90:45)+swatchW+gap,legY+swatchH/2+1);
  // Linear
  if(hasLinear){
    ctx.fillStyle="rgba(251,154,153,0.9)";ctx.fillRect(midX+10,legY,swatchW,swatchH);
    ctx.fillText("Linear dist.",midX+10+swatchW+gap,legY+swatchH/2+1);
  }

},[places,maxDist,_sz]);

return(<div ref={pRef} style={{width:"100%",height:"100%",padding:4}}>
  <canvas ref={cRef} style={{display:"block"}}/>
</div>);}

const map=new maplibregl.Map({container:cRef.current,style:{version:8,sources:{"esri-sat":{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"Esri"}},layers:[{id:"esri-sat",type:"raster",source:"esri-sat"}]},center:[meta.longitude,meta.latitude],zoom:14.45,attributionControl:false,interactive:true});

  if(map.getLayer("building")){map.setPaintProperty("building","fill-color","#2a2e33");map.setPaintProperty("building","fill-opacity",0.9);map.setPaintProperty("building","fill-outline-color","#3a3f46");}

function DensityMap({density,meta}){
const cRef=useRef(null);const mapRef=useRef(null);
useEffect(()=>{if(!cRef.current)return;const o=new ResizeObserver(()=>{if(mapRef.current)mapRef.current.resize();});o.observe(cRef.current);return()=>o.disconnect();},[]);
useEffect(()=>{if(!cRef.current||!density)return;
const{bounds,gs,grid,peaks,pts,ctr,npts,paths}=density;
const[west,south,east,north]=bounds;
const colorFn=makeYlOrRd(npts);

const map=new maplibregl.Map({container:cRef.current,style:{version:8,sources:{"esri-sat":{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"Esri"}},layers:[{id:"esri-sat",type:"raster",source:"esri-sat"}]},center:[meta.longitude,meta.latitude],zoom:13.45,attributionControl:false,interactive:true});
mapRef.current=map;

map.on("load",()=>{
  const canvas=document.createElement("canvas");canvas.width=gs;canvas.height=gs;
  const ctx=canvas.getContext("2d");const imgData=ctx.createImageData(gs,gs);
  for(let j=0;j<gs;j++){for(let i=0;i<gs;i++){
    const gi=i,gj=gs-1-j;const val=grid[gi*gs+gj]/255;
    const[r,g,b,a]=colorFn(val);const idx=(j*gs+i)*4;
    imgData.data[idx]=r;imgData.data[idx+1]=g;imgData.data[idx+2]=b;imgData.data[idx+3]=a;}}
  ctx.putImageData(imgData,0,0);
  if(map.getLayer("building")){map.setPaintProperty("building","fill-color","#2a2e33");map.setPaintProperty("building","fill-opacity",0.9);map.setPaintProperty("building","fill-outline-color","#3a3f46");}
  map.addSource("density-img",{type:"image",url:canvas.toDataURL(),coordinates:[[west,north],[east,north],[east,south],[west,south]]});
  map.addLayer({id:"density-layer",type:"raster",source:"density-img",paint:{"raster-opacity":0.8,"raster-fade-duration":0}});

  if(ctr&&ctr.length){
    const features=ctr.map(c=>({type:"Feature",geometry:{type:"LineString",coordinates:c.c},properties:{level:c.l}}));
    map.addSource("contours",{type:"geojson",data:{type:"FeatureCollection",features}});
    map.addLayer({id:"contour-lines",type:"line",source:"contours",paint:{
      "line-color":["interpolate",["linear"],["get","level"],0.15,"rgba(0,0,0,0.12)",0.35,"rgba(0,0,0,0.2)",0.55,"rgba(0,0,0,0.3)",0.75,"rgba(40,0,0,0.35)",0.85,"rgba(60,0,0,0.4)"],
      "line-width":["interpolate",["linear"],["get","level"],0.15,0.6,0.5,1.0,0.85,1.5]}});
  }

  if(pts&&pts.length){
    const ptF=pts.map(p=>({type:"Feature",geometry:{type:"Point",coordinates:[p[1],p[0]]},properties:{}}));
    map.addSource("density-pts",{type:"geojson",data:{type:"FeatureCollection",features:ptF}});
    map.addLayer({id:"density-pts-layer",type:"circle",source:"density-pts",paint:{
      "circle-radius":["interpolate",["linear"],["zoom"],10,0.8,14,2,18,4],
      "circle-color":"#3366cc","circle-opacity":0.55,"circle-stroke-width":0.3,"circle-stroke-color":"#111"}});
  }

  // Stadium center marker (white ring)
  map.addSource("stadium-center",{type:"geojson",data:{type:"Feature",geometry:{type:"Point",coordinates:[meta.longitude,meta.latitude]},properties:{}}});
  map.addLayer({id:"stadium-center-ring",type:"circle",source:"stadium-center",paint:{"circle-radius":8,"circle-color":"transparent","circle-stroke-width":2,"circle-stroke-color":"rgba(255,255,255,0.7)"}});

  // Shortest path layer — starts empty, filled on hover
  map.addSource("active-path",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  // Glow underneath
  map.addLayer({id:"active-path-glow",type:"line",source:"active-path",paint:{
    "line-color":"#00ff88","line-width":6,"line-opacity":0.25,"line-blur":4}});
  // Dashed path on top
  map.addLayer({id:"active-path-line",type:"line",source:"active-path",paint:{
    "line-color":"#00ff88","line-width":2,"line-opacity":0.9,"line-dasharray":[4,3]}});

  // Peaks
  if(peaks&&peaks.length){
    const pkF=peaks.map((p,i)=>({type:"Feature",geometry:{type:"Point",coordinates:[p[1],p[0]]},properties:{idx:i,density:p[2],lat:p[0],lng:p[1],dist:p[3]||null}}));
    map.addSource("peaks",{type:"geojson",data:{type:"FeatureCollection",features:pkF}});
    map.addLayer({id:"peaks-glow",type:"circle",source:"peaks",paint:{"circle-radius":14,"circle-blur":0.6,"circle-color":"rgba(0,255,136,0.15)"}});
    map.addLayer({id:"peaks-dot",type:"circle",source:"peaks",paint:{"circle-radius":5,"circle-color":"#00ff88","circle-stroke-width":1.5,"circle-stroke-color":"#000"}});

    const popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:10});

    map.on("mouseenter","peaks-dot",(e)=>{
      map.getCanvas().style.cursor="pointer";
      const p=e.features[0].properties;
      const idx=p.idx;

      // Show path if paths data exists
      const pathEntry=paths&&paths.find(p=>p.peakIdx===idx);
      if(pathEntry&&pathEntry.coords&&pathEntry.coords.length>0){
        const coords=pathEntry.coords.map(pt=>[pt[0],pt[1]]);
        map.getSource("active-path").setData({
          type:"FeatureCollection",
          features:[{type:"Feature",geometry:{type:"LineString",coordinates:coords},properties:{}}]
        });
      } else {
        // Fallback: draw straight line from peak to stadium center
        map.getSource("active-path").setData({
          type:"FeatureCollection",
          features:[{type:"Feature",geometry:{type:"LineString",coordinates:[[p.lng,p.lat],[meta.longitude,meta.latitude]]},properties:{}}]
        });
      }

      const pathEntry2=paths&&paths.find(pp=>pp.peakIdx===idx);const distLabel=pathEntry2?`${Math.round(pathEntry2.dist)}m walking`:"—";
      popup.setLngLat(e.features[0].geometry.coordinates).setHTML(
        `<div style="font-family:system-ui;font-size:10px">
          <strong style="color:#00ff88">Density Peak #${idx+1}</strong><br>
          <span style="color:#aaa">Intensity: ${(p.density*100).toFixed(0)}%</span><br>
          <span style="color:#888">${distLabel}</span><br>
          <span style="color:#666">${Number(p.lat).toFixed(5)}°, ${Number(p.lng).toFixed(5)}°</span>
        </div>`
      ).addTo(map);
    });

    map.on("mouseleave","peaks-dot",()=>{
      map.getCanvas().style.cursor="";
      popup.remove();
      // Clear path
      map.getSource("active-path").setData({type:"FeatureCollection",features:[]});
    });
  }
});return()=>{map.remove();mapRef.current=null;};},[density,meta]);
return <div ref={cRef} style={{width:"100%",height:"100%"}}/>;
}

function DistHist({places,maxDist,selInterval,onIntervalClick,meta}){
const cRef=useRef(null);const pRef=useRef(null);
const binSize=250;const nBins=Math.ceil(3000/binSize);
const binsRef=useRef([]);const geomRef=useRef({});
const [_sz,_setSz]=useState(0);
useEffect(()=>{if(!pRef.current)return;const o=new ResizeObserver(()=>_setSz(n=>n+1));o.observe(pRef.current);return()=>o.disconnect();},[]);

useEffect(()=>{if(!places?.length||!pRef.current)return;const c=cRef.current;const rect=pRef.current.getBoundingClientRect();
const w=rect.width-4,h=rect.height-4;if(w<20||h<20)return;c.width=w*2;c.height=h*2;c.style.width=w+"px";c.style.height=h+"px";
const ctx=c.getContext("2d");ctx.scale(2,2);ctx.clearRect(0,0,w,h);

const dists=places.map(d=>d[3]).filter(d=>d!=null&&d<=3000);
const bins=new Array(nBins).fill(0);
dists.forEach(d=>{const b=Math.min(Math.floor(d/binSize),nBins-1);bins[b]++;});
binsRef.current=bins;

const fixedMax=1500;
const pad={t:6,b:22,l:64,r:10};
const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
const bh=ph/nBins;
const totalBarsH=bh*nBins;
const yOff=pad.t+(ph-totalBarsH)/2;
geomRef.current={pad,pw,ph,bh,totalBarsH,yOff,fixedMax,w,h};

bins.forEach((n,i)=>{
  const barW=Math.min((n/fixedMax)*pw,pw);
  const row=nBins-1-i;
  const y=yOff+row*bh;
  const isSelected=selInterval&&selInterval[0]===i*binSize&&selInterval[1]===(i+1)*binSize;
  ctx.fillStyle=isSelected?"rgba(80,160,220,0.95)":"rgba(80,160,220,0.45)";
  ctx.fillRect(pad.l,y+1,barW,bh-2);
  if(isSelected){
    ctx.strokeStyle="rgba(120,190,255,0.9)";ctx.lineWidth=1;
    ctx.strokeRect(pad.l,y+1,barW,bh-2);
  }
});

ctx.fillStyle="#999";ctx.font="9px system-ui";ctx.textAlign="right";ctx.textBaseline="middle";
for(let i=0;i<nBins;i++){
  const row=nBins-1-i;
  const label=`(${i*binSize}, ${(i+1)*binSize}]`;
  ctx.fillText(label,pad.l-4,yOff+row*bh+bh/2);
}
ctx.strokeStyle="#444";ctx.lineWidth=0.5;
ctx.beginPath();ctx.moveTo(pad.l,yOff);ctx.lineTo(pad.l,yOff+totalBarsH);ctx.lineTo(pad.l+pw,yOff+totalBarsH);ctx.stroke();
// X-axis: only 0 and 1500
ctx.fillStyle="#999";ctx.font="8px system-ui";ctx.textAlign="center";ctx.textBaseline="top";
[0,1500].forEach(v=>{
  const x=pad.l+(v/fixedMax)*pw;
  ctx.fillText(v.toString(),x,yOff+totalBarsH+4);
  ctx.strokeStyle="#333";ctx.beginPath();ctx.moveTo(x,yOff+totalBarsH);ctx.lineTo(x,yOff+totalBarsH+3);ctx.stroke();
});
// Count labels on each bar
bins.forEach((n,i)=>{
  if(n===0)return;
  const barW=Math.min((n/fixedMax)*pw,pw);
  const row=nBins-1-i;
  const y=yOff+row*bh+bh/2;
  ctx.font="7px system-ui";ctx.textBaseline="middle";
  const txt=n.toString();
  const txtW=ctx.measureText(txt).width;
  const spaceInBar=barW-4;
  if(spaceInBar>txtW+2){
    // enough room inside bar — draw at right edge of bar
    ctx.fillStyle="rgba(255,255,255,0.9)";ctx.textAlign="right";
    ctx.fillText(txt,pad.l+barW-3,y);
  } else {
    // bar too small — draw just after bar end
    ctx.fillStyle="rgba(180,180,180,0.8)";ctx.textAlign="left";
    ctx.fillText(txt,pad.l+barW+3,y);
  }
});
},[places,selInterval,meta,_sz]);

const handleClick=(e)=>{
  if(!pRef.current)return;
  const rect=cRef.current.getBoundingClientRect();
  const my=e.clientY-rect.top;
  const{pad,bh,totalBarsH,yOff}=geomRef.current;
  if(my<yOff||my>yOff+totalBarsH)return;
  const row=Math.floor((my-yOff)/bh);
  const bin=nBins-1-row;
  if(bin>=0&&bin<nBins)onIntervalClick(bin*binSize,(bin+1)*binSize);
};

return(<div ref={pRef} style={{width:"100%",height:"100%",cursor:"pointer"}}>
  <canvas ref={cRef} style={{display:"block"}} onClick={handleClick}/>
</div>);}

function CompChart({places,meta}){
const cRef=useRef(null);const pRef=useRef(null);
const[tooltip,setTooltip]=useState(null);
const chartData=useRef(null);
const [_sz,_setSz]=useState(0);
useEffect(()=>{if(!pRef.current)return;const o=new ResizeObserver(()=>_setSz(n=>n+1));o.observe(pRef.current);return()=>o.disconnect();},[]);
useEffect(()=>{if(!places?.length||!pRef.current)return;const c=cRef.current;const rect=pRef.current.getBoundingClientRect();
const w=rect.width-4,h=rect.height-4;if(w<20||h<20)return;c.width=w*2;c.height=h*2;c.style.width=w+"px";c.style.height=h+"px";
const ctx=c.getContext("2d");ctx.scale(2,2);ctx.clearRect(0,0,w,h);
const intervalSize=200;const maxDist=3000;const numIntervals=Math.ceil(maxDist/intervalSize);const cats=Object.keys(CC);
const counts={};const totals={};
cats.forEach(cat=>{counts[cat]=new Array(numIntervals).fill(0);totals[cat]=0;});
places.forEach(d=>{
  const dist=d[3];if(dist==null)return;
  const bin=Math.min(Math.floor(dist/intervalSize),numIntervals-1);
  const cat=d[2];if(counts[cat]){counts[cat][bin]++;totals[cat]++;}
});
const allVals=cats.flatMap(cat=>counts[cat]);
const maxVal=Math.max(...allVals,1);
const pad={t:8,b:36,l:36,r:6};
const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
chartData.current={counts,totals,maxVal,pad,pw,ph,w,h,intervalSize,numIntervals,cats};
ctx.strokeStyle="#333";ctx.lineWidth=0.5;
const yTicks=5;
for(let i=0;i<=yTicks;i++){const y=pad.t+ph-i*(ph/yTicks);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+pw,y);ctx.stroke();}
for(let i=0;i<numIntervals;i++){const x=pad.l+i*(pw/(numIntervals-1));ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();}
cats.forEach(cat=>{
  const co=CC[cat]||CC.uncategorized;const data=counts[cat];
  if(!data.some(v=>v>0))return;
  ctx.strokeStyle=`rgb(${co})`;ctx.lineWidth=2;ctx.beginPath();
  let started=false;
  data.forEach((v,i)=>{
    const x=pad.l+i*(pw/(numIntervals-1));const y=pad.t+ph-(v/maxVal)*ph;
    if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);});

function Donut({catCount,selCats,onToggle}){
// Squarified treemap using canvas
const cRef=useRef(null);const pRef=useRef(null);
const [_sz,_setSz]=useState(0);
useEffect(()=>{if(!pRef.current)return;const o=new ResizeObserver(()=>_setSz(n=>n+1));o.observe(pRef.current);return()=>o.disconnect();},[]);

// Squarify algorithm
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const total=items.reduce((s,d)=>s+d.v,0);
  const rects=[];
  function layoutRow(row,x,y,w,h,horiz){
    const rowTotal=row.reduce((s,d)=>s+d.v,0);
    let pos=horiz?x:y;
    row.forEach(d=>{
      const frac=d.v/rowTotal;
      const rw=horiz?frac*(w):w;
      const rh=horiz?h:frac*(h);
      const rx=horiz?pos:x;
      const ry=horiz?y:pos;
      rects.push({...d,x:rx,y:ry,w:rw,h:rh});
      pos+=horiz?rw:rh;
    });
  }
  function worst(row,side){
    const s=side;const rowTotal=row.reduce((s,d)=>s+d.v,0);
    const maxV=Math.max(...row.map(d=>d.v));
    const minV=Math.min(...row.map(d=>d.v));
    return Math.max((s*s*maxV)/(rowTotal*rowTotal),(rowTotal*rowTotal)/(s*s*minV));
  }
  const scale=w*h/total;
  const scaled=items.map(d=>({...d,v:d.v*scale}));
  let row=[];let cx=x,cy=y,cw=w,ch=h;
  scaled.forEach((d,i)=>{
    const horiz=cw>=ch;const side=horiz?ch:cw;
    const test=[...row,d];
    if(!row.length||worst(test,side)<=worst(row,side)){
      row.push(d);
    } else {
      const rowTotal=row.reduce((s,d)=>s+d.v,0);
      const rowSide=rowTotal/(horiz?ch:cw);
      layoutRow(row,cx,cy,horiz?rowSide:cw,horiz?ch:rowSide,horiz);
      if(horiz){cx+=rowSide;cw-=rowSide;}else{cy+=rowSide;ch-=rowSide;}
      row=[d];
    }
  });
  if(row.length){
    const horiz=cw>=ch;
    layoutRow(row,cx,cy,cw,ch,horiz);
  }
  return rects;
}

useEffect(()=>{
  const entries=Object.entries(catCount||{}).filter(([,v])=>v>0)

      ctx.font=`600 ${fs}px system-ui`;

      ctx.fillText(label,r.x+r.w/2,r.y+r.h/2-(minDim>28?fs*0.6:0));

        ctx.fillText(r.n,r.x+r.w/2,r.y+r.h/2+fs*0.7);
      }
    }
  });
},[catCount,selCats,_sz]);
const rectsRef=useRef([]);
const handleClick=(e)=>{

  if(hit)onToggle(hit.cat);
};
return(<div ref={pRef} style={{width:"100%",height:"100%"}}>
  <canvas ref={cRef} style={{display:"block",cursor:"pointer"}} onClick={handleClick}/>
</div>);}

// Satellite map with a Shannon-diversity grid overlay (whole-map scale) plus a
// right column: overall index, diversity across walking-distance rings (the
// "centrality" scale, approximated by network distance), and category mix.
function DiversityGrid({meta,places,nCells=28,extentM=1500}){
const cRef=useRef(null);const mapRef=useRef(null);
useEffect(()=>{if(!cRef.current)return;const o=new ResizeObserver(()=>{if(mapRef.current)mapRef.current.resize();});o.observe(cRef.current);return()=>o.disconnect();},[]);
useEffect(()=>{
  if(!cRef.current||!places?.length)return;
  const cLat=meta.latitude,cLng=meta.longitude;
  const latHalf=extentM/111320;
  const lonHalf=extentM/(111320*Math.cos(cLat*Math.PI/180));
  const cellLat=2*latHalf/nCells,cellLon=2*lonHalf/nCells;

  // Bin places into grid cells, tallying category counts per cell.
  const cells={};
  places.forEach(d=>{
    const lat=d[0],lng=d[1],cat=d[2]||"uncategorized";
    const col=Math.floor((lng-(cLng-lonHalf))/cellLon);
    const row=Math.floor(((cLat+latHalf)-lat)/cellLat);
    if(col<0||col>=nCells||row<0||row>=nCells)return;
    const k=row+"_"+col;
    if(!cells[k])cells[k]={counts:{},total:0,row,col};
    cells[k].counts[cat]=(cells[k].counts[cat]||0)+1;
    cells[k].total++;
  });
  let maxDiv=0;
  Object.values(cells).forEach(c=>{c.div=divScore(c.counts,c.total);if(c.div>maxDiv)maxDiv=c.div;});
  const features=Object.values(cells).map(c=>{
    const t=maxDiv>0?c.div/maxDiv:0;
    const[r,g,b]=viridis(t);
    const a=(0.25+0.6*t).toFixed(2);
    const west=cLng-lonHalf+c.col*cellLon,east=west+cellLon;
    const north=cLat+latHalf-c.row*cellLat,south=north-cellLat;
    return{type:"Feature",geometry:{type:"Polygon",coordinates:[[[west,south],[east,south],[east,north],[west,north],[west,south]]]},
      properties:{color:`rgba(${r},${g},${b},${a})`,div:+c.div.toFixed(3),total:c.total,cats:Object.keys(c.counts).length}};
  });

  const map=new maplibregl.Map({container:cRef.current,style:{version:8,sources:{"esri-sat":{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"Esri"}},layers:[{id:"esri-sat",type:"raster",source:"esri-sat"}]},center:[cLng,cLat],zoom:13.2,attributionControl:false,interactive:true});
  mapRef.current=map;
  map.on("load",()=>{
    map.addSource("divgrid",{type:"geojson",data:{type:"FeatureCollection",features}});
    map.addLayer({id:"divgrid-fill",type:"fill",source:"divgrid",paint:{"fill-color":["get","color"],"fill-outline-color":"rgba(0,0,0,0.25)"}});
    map.addSource("stad-c",{type:"geojson",data:{type:"Feature",geometry:{type:"Point",coordinates:[cLng,cLat]},properties:{}}});
    map.addLayer({id:"stad-c-ring",type:"circle",source:"stad-c",paint:{"circle-radius":7,"circle-color":"transparent","circle-stroke-width":2,"circle-stroke-color":"rgba(255,255,255,0.85)"}});
    map.fitBounds([[cLng-lonHalf,cLat-latHalf],[cLng+lonHalf,cLat+latHalf]],{padding:8,duration:0});

    const popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:8});
    map.on("mousemove","divgrid-fill",e=>{
      map.getCanvas().style.cursor="pointer";
      const p=e.features[0].properties;
      popup.setLngLat(e.lngLat).setHTML(`<div style="font-family:var(--font);font-size:11px"><b style="color:#5CB8A7">Diversity ${(+p.div).toFixed(2)}</b><br>${p.total} place${p.total!==1?"s":""} · ${p.cats} categor${p.cats!==1?"ies":"y"}</div>`).addTo(map);
    });
    map.on("mouseleave","divgrid-fill",()=>{map.getCanvas().style.cursor="";popup.remove();});
  });
  return()=>{map.remove();mapRef.current=null;};
},[places,meta,nCells,extentM]);
return <div ref={cRef} style={{width:"100%",height:"100%"}}/>;
}

      </div>
      <div style={{flex:1,minHeight:0,overflowY:"auto",padding:"8px 12px"}}>
        {rings.map(r=>{const t=r.div/maxRingDiv;return(
          <div key={r.label} style={{display:"flex",alignItems:"center",gap:7,padding:"2px 0"}}>
            <span style={{width:62,flexShrink:0,fontSize:8.5,color:"#8a9298",fontFamily:"'Courier New',monospace",textAlign:"right"}}>{r.label}</span>
            <div style={{flex:1,height:13,background:"#1e2123",borderRadius:2,overflow:"hidden"}}>
              <div style={{width:`${Math.round(t*100)}%`,height:"100%",background:`rgb(${viridis(t)})`,transition:"width 0.3s"}}/>
            </div>
            <span style={{width:30,flexShrink:0,fontSize:9,color:r.total?"#cfd3d6":"#555",fontFamily:"'Courier New',monospace",textAlign:"right"}}>{r.total?r.div.toFixed(2):"—"}</span>
          </div>);})}
        <div style={{fontSize:8,color:"#5a6168",marginTop:6,lineHeight:1.5}}>Bar length & colour scale to the busiest ring. Distance is along the street network, not straight-line.</div>
      </div>
    </div>

    {/* Category composition */}
    <div style={{background:"#151616",borderRadius:6,flexShrink:0,maxHeight:168,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{padding:"6px 12px",borderBottom:"1px solid #2a2e31",flexShrink:0,fontSize:10,fontWeight:600,color:"#b4bac0"}}>Category composition</div>
      <div style={{flex:1,minHeight:0,overflowY:"auto",padding:"6px 12px"}}>
        {topCats.map(([cat,n])=>{const co=CC[cat]||CC.uncategorized;const pct=total?n/total*100:0;return(
          <div key={cat} style={{display:"flex",alignItems:"center",gap:6,padding:"2px 0"}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:`rgb(${co})`,flexShrink:0}}/>
            <span style={{width:78,flexShrink:0,fontSize:9.5,color:"#c9ced3",textTransform:"capitalize",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cat}</span>
            <div style={{flex:1,height:8,background:"#1e2123",borderRadius:2,overflow:"hidden"}}>
              <div style={{width:`${pct}%`,height:"100%",background:`rgb(${co})`,opacity:0.75}}/>
            </div>
            <span style={{width:30,flexShrink:0,fontSize:8.5,color:"#9aa1a8",fontFamily:"'Courier New',monospace",textAlign:"right"}}>{pct.toFixed(0)}%</span>
          </div>);})}
      </div>
    </div>

  </div>
</div>
</React.Fragment>);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));


</script>
</body>
</html>
